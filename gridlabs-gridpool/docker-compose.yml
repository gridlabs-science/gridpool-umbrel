services:
  app_proxy:
    environment:
      APP_HOST: gridpool
      APP_PORT: 5000

  init:
    image: ghcr.io/gridlabs-science/gridpool-sv2-pool@sha256:894b04939da127188d97dd53aaf5e3a6514de959c827a6ba34161ed5a2fc6fb0
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        /bin/sh /templates/init.sh
        sed -n 's/^authority_public_key=/GRIDPOOL_NATIVE_SV2_AUTHORITY_PUBLIC_KEY=/p' /data/sv2/authority.env > /data/shared/sv2-public.env
        test -s /data/shared/sv2-public.env
        chmod 644 /data/shared/sv2-public.env
    environment:
      GRIDPOOL_PACKAGE_VERSION: "0.2.2-beta.9"
      APP_BITCOIN_NODE_IP: ${APP_BITCOIN_NODE_IP}
      APP_BITCOIN_RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      APP_BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      APP_BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
      APP_BITCOIN_ZMQ_HASHBLOCK_PORT: ${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}
      APP_BITCOIN_ZMQ_RAWBLOCK_PORT: ${APP_BITCOIN_ZMQ_RAWBLOCK_PORT}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/templates:/templates:ro

  gridpool:
    image: ghcr.io/gridlabs-science/boot-protocol@sha256:c83601e3fd051b834b02376dbd7827652fa96826b9454050c5d2ae933f9475bc
    depends_on:
      init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -a
        . /shared/sv2-public.env
        set +a
        exec /bin/sh /templates/gridpool-entrypoint.sh
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      BOOT_PORTAL_LOCAL_CONFIG_PATH: /shared/boot_portal_config.local.json
      GRIDPOOL_TRUSTED_PRIVATE_DASHBOARD_ENABLED: "true"
    volumes:
      - ${APP_DATA_DIR}/data/gridpool:/data
      - ${APP_DATA_DIR}/data/shared:/shared
      - ${APP_DATA_DIR}/templates:/templates:ro
    ports:
      - "5001:5001/udp"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  sv2:
    image: ghcr.io/gridlabs-science/gridpool-sv2-pool@sha256:894b04939da127188d97dd53aaf5e3a6514de959c827a6ba34161ed5a2fc6fb0
    depends_on:
      init:
        condition: service_completed_successfully
      gridpool:
        condition: service_started
    entrypoint: ["/bin/sh", "/templates/sv2-entrypoint.sh"]
    restart: unless-stopped
    stop_signal: SIGINT
    environment:
      APP_BITCOIN_NODE_IP: ${APP_BITCOIN_NODE_IP}
      APP_BITCOIN_RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      APP_BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      APP_BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
    volumes:
      - ${APP_DATA_DIR}/data/sv2:/data
      - ${APP_DATA_DIR}/data/shared:/shared:ro
      - ${APP_DATA_DIR}/templates:/templates:ro
    ports:
      - "34265:34265/tcp"
