services:
  app_proxy:
    environment:
      APP_HOST: gridlabs-gridpool_gridpool_1
      APP_PORT: 5000

  init:
    image: ghcr.io/gridlabs-science/gridpool-sv2-pool:sha-bba078e
    user: "0:0"
    entrypoint: ["/bin/sh", "/templates/init.sh"]
    env_file:
      - ./settings.env
    environment:
      APP_BITCOIN_NODE_IP: ${APP_BITCOIN_NODE_IP}
      APP_BITCOIN_RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      APP_BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      APP_BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
      APP_BITCOIN_ZMQ_HASHBLOCK_PORT: ${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}
      APP_BITCOIN_ZMQ_RAWBLOCK_PORT: ${APP_BITCOIN_ZMQ_RAWBLOCK_PORT}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ./templates:/templates:ro

  gridpool:
    image: ghcr.io/gridlabs-science/boot-protocol:sha-320c111
    depends_on:
      init:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s
    environment:
      BOOT_PORTAL_LOCAL_CONFIG_PATH: /shared/boot_portal_config.local.json
    volumes:
      - ${APP_DATA_DIR}/data/gridpool:/data
      - ${APP_DATA_DIR}/data/shared:/shared
    ports:
      - "5001:5001/udp"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  sv2:
    image: ghcr.io/gridlabs-science/gridpool-sv2-pool:sha-bba078e
    depends_on:
      init:
        condition: service_completed_successfully
      gridpool:
        condition: service_healthy
    command: ["--config", "/data/pool-config.toml"]
    restart: on-failure
    stop_signal: SIGINT
    volumes:
      - ${APP_DATA_DIR}/data/sv2:/data
      - ${APP_DATA_DIR}/data/shared:/shared:ro
    ports:
      - "34265:34265/tcp"
