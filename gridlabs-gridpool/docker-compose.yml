services:
  app_proxy:
    environment:
      APP_HOST: gridpool
      APP_PORT: 5000

  init:
    image: ghcr.io/gridlabs-science/gridpool-sv2-pool@sha256:3de54e9c51953d2b5089ae90a25b9a0fa046c18c4ae0139b768b77a4cf0ed50e
    user: "0:0"
    entrypoint: ["/bin/sh", "/templates/init.sh"]
    environment:
      APP_BITCOIN_NODE_IP: ${APP_BITCOIN_NODE_IP}
      APP_BITCOIN_RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      APP_BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      APP_BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
      APP_BITCOIN_ZMQ_HASHBLOCK_PORT: ${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}
      APP_BITCOIN_ZMQ_RAWBLOCK_PORT: ${APP_BITCOIN_ZMQ_RAWBLOCK_PORT}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/templates:/templates:ro

  gridpool:
    image: ghcr.io/gridlabs-science/boot-protocol@sha256:8672c835b14f8fcad8a358e5b80ae945d6973b5039c706437b3b1c4bdff6f5d5
    depends_on:
      init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/templates/gridpool-entrypoint.sh"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      BOOT_PORTAL_LOCAL_CONFIG_PATH: /shared/boot_portal_config.local.json
    volumes:
      - ${APP_DATA_DIR}/data/gridpool:/data
      - ${APP_DATA_DIR}/data/shared:/shared
      - ${APP_DATA_DIR}/templates:/templates:ro
    ports:
      - "5001:5001/udp"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  sv2:
    image: ghcr.io/gridlabs-science/gridpool-sv2-pool@sha256:3de54e9c51953d2b5089ae90a25b9a0fa046c18c4ae0139b768b77a4cf0ed50e
    depends_on:
      init:
        condition: service_completed_successfully
      gridpool:
        condition: service_started
    entrypoint: ["/bin/sh", "/templates/sv2-entrypoint.sh"]
    restart: unless-stopped
    stop_signal: SIGINT
    environment:
      APP_BITCOIN_NODE_IP: ${APP_BITCOIN_NODE_IP}
      APP_BITCOIN_RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      APP_BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      APP_BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
    volumes:
      - ${APP_DATA_DIR}/data/sv2:/data
      - ${APP_DATA_DIR}/data/shared:/shared:ro
      - ${APP_DATA_DIR}/templates:/templates:ro
    ports:
      - "34265:34265/tcp"
