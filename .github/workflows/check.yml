name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: >-
          sh -n
          gridlabs-gridpool/templates/init.sh
          gridlabs-gridpool/templates/gridpool-entrypoint.sh
          gridlabs-gridpool/templates/sv2-entrypoint.sh
      - name: Parse YAML
        run: |
          ruby -e 'require "yaml"; YAML.load_file("gridlabs-gridpool/umbrel-app.yml")'
          ruby -e 'require "yaml"; YAML.load_file("gridlabs-gridpool/docker-compose.yml")'
      - name: Render boot config
        env:
          GRIDPOOL_PAYOUT_ADDRESS: ""
          BITCOIN_RPC_URL: http://bitcoin:8332
          APP_BITCOIN_RPC_USER: test
          APP_BITCOIN_RPC_PASS: test
          BITCOIN_ZMQ_HASHBLOCK: tcp://bitcoin:28332
          BITCOIN_ZMQ_RAWBLOCK: tcp://bitcoin:28333
        run: |
          envsubst < gridlabs-gridpool/templates/boot_portal_config.json.template > /tmp/config.json
          jq empty /tmp/config.json
          test "$(jq -r .pool_payout_script /tmp/config.json)" = ""
      - name: Verify UI-driven payout lifecycle
        run: |
          ! grep -q 'env_file' gridlabs-gridpool/docker-compose.yml
          test "$(grep -Fc '${APP_DATA_DIR}/templates:/templates:ro' gridlabs-gridpool/docker-compose.yml)" = "3"
          ! grep -Fq '${GRIDPOOL_PAYOUT_ADDRESS:-}' gridlabs-gridpool/templates/init.sh
          grep -q 'boot_portal_config.local.json' gridlabs-gridpool/templates/gridpool-entrypoint.sh
          grep -q 'boot_portal_config.local.json' gridlabs-gridpool/templates/sv2-entrypoint.sh
      - name: Verify release inputs and package contract
        run: ./scripts/verify-package.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --redact --no-banner

  image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/gridlabs-science/boot-protocol@sha256:1a302f3d1a1de3df7b26a4cde6372bf31d453bd024ca697bd6f0a1a09c90b601
          - ghcr.io/gridlabs-science/gridpool-sv2-pool@sha256:6bea980aa517f308ee176d1a85d5e274e69a92fe99df1b321a7a720ae5db3e70
    steps:
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
