name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: bash -n configure.sh gridlabs-gridpool/templates/init.sh
      - name: Parse YAML
        run: |
          ruby -e 'require "yaml"; YAML.load_file("gridlabs-gridpool/umbrel-app.yml")'
          ruby -e 'require "yaml"; YAML.load_file("gridlabs-gridpool/docker-compose.yml")'
      - name: Render boot config
        env:
          GRIDPOOL_PAYOUT_ADDRESS: bc1qd9m04z95mglaxd9e9accmhyjdlmkfmzjprkq4p
          BITCOIN_RPC_URL: http://bitcoin:8332
          APP_BITCOIN_RPC_USER: test
          APP_BITCOIN_RPC_PASS: test
          BITCOIN_ZMQ_HASHBLOCK: tcp://bitcoin:28332
          BITCOIN_ZMQ_RAWBLOCK: tcp://bitcoin:28333
        run: |
          envsubst < gridlabs-gridpool/templates/boot_portal_config.json.template > /tmp/config.json
          jq empty /tmp/config.json
          test "$(jq -r '.native_sv2_enabled' /tmp/config.json)" = "true"
          test "$(jq -r '.native_sv2_public_port' /tmp/config.json)" = "34265"
          test "$(jq -r '.enable_admin_api' /tmp/config.json)" = "false"
